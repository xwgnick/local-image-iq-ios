name: Native iOS — manual validation

on:
  workflow_dispatch:
    inputs:
      include_models:
        description: "Download the pinned public pair, convert on Mac and run native parity (slower, larger artifacts)"
        type: boolean
        default: false
      all_compute_units:
        description: "Also compare Core ML .all against CPU reference fixtures"
        type: boolean
        default: false
      build_device_ipa:
        description: "After tests, build an unsigned arm64 iPhone IPA for local re-signing (requires include_models)"
        type: boolean
        default: false
      publish_release:
        description: "Publish validated assets to a GitHub Release; disable for engineering validation only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  simulator:
    # User-approved public source repository; generated fixtures only, no personal data.
    # This remains manual workflow_dispatch, never privileged pull-request execution.
    if: github.event.repository.private == false && github.repository == 'xwgnick/local-image-iq-ios'
    runs-on: macos-15
    # Standard hosted runner in the approved PUBLIC repository; no paid larger runner.
    # Write permission is used only for the existing exact-repository Release delivery.
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IMAGEIQ_REQUIRE_MODELS: ${{ inputs.include_models && '1' || '0' }}
      IMAGEIQ_TEST_ALL_COMPUTE_UNITS: ${{ inputs.all_compute_units && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Inspect build tools
        run: |
          uname -m
          node scripts/check_release.mjs --toolchain
          swift --version
          python --version
      - name: Validate device build selection
        if: inputs.build_device_ipa
        run: |
          test "$IMAGEIQ_REQUIRE_MODELS" = "1" || { echo 'Device IPA requires include_models=true'; exit 1; }
      - name: Check source contracts and pure Swift core
        run: |
          node scripts/check_project.mjs --self-test
          node scripts/check_project.mjs
          node scripts/check_release.mjs --source
          node scripts/check_places.mjs --self-test
          node scripts/check_places.mjs
          node scripts/package_device.mjs --self-test
          node --test scripts/test_publish_release.mjs scripts/test_release.mjs
          python scripts/test_static.py
          python scripts/test_branding.py
          plutil -lint App/Info.plist
          plutil -lint App/PrivacyInfo.xcprivacy
          swift test --package-path Packages/ImageIQCore
      - name: Generate and validate required public offline Places pack
        # Unconditional: include_models=false still ships the four-country pack.
        # Use setup-python's isolated runner Python, never the Core ML conversion venv.
        run: |
          python -m pip install shapely==2.1.2
          python scripts/test_places.py
          python scripts/build_places.py --download
          node scripts/check_places.mjs --pack-dir Resources/Places
      - name: Convert and check pinned model pair
        if: inputs.include_models
        run: |
          python -m venv .model-env
          .model-env/bin/python -m pip install -r scripts/requirements-coreml.txt
          .model-env/bin/python scripts/export_models.py --download
          node scripts/check_project.mjs --models
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version
          if [ "$IMAGEIQ_REQUIRE_MODELS" = "1" ]; then
            xcodegen generate --spec project.models.yml
          else
            xcodegen generate --spec project.yml
          fi
      - name: Select an available iPhone simulator
        run: |
          # UI regression tests need the software keyboard, not a host keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-devices.json"
          node scripts/check_release.mjs --simulator "$RUNNER_TEMP/available-devices.json"
      - name: Verify resolved dependency licenses before compiling
        run: |
          xcodebuild -resolvePackageDependencies -project LocalImageIQ.xcodeproj -scheme LocalImageIQ \
            -clonedSourcePackagesDirPath build/SourcePackages
          node scripts/prepare_legal_notices.mjs build/SourcePackages/checkouts --check
      - name: Build and test (unsigned simulator only)
        run: |
          xcodebuild test -project LocalImageIQ.xcodeproj -scheme LocalImageIQ \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult \
            -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            IMAGEIQ_REQUIRE_MODELS="$IMAGEIQ_REQUIRE_MODELS" \
            IMAGEIQ_TEST_ALL_COMPUTE_UNITS="$IMAGEIQ_TEST_ALL_COMPUTE_UNITS"
          node scripts/check_places.mjs --app-dir build/DerivedData/Build/Products/Debug-iphonesimulator/LocalImageIQ.app
          node scripts/check_release.mjs --app-dir build/DerivedData/Build/Products/Debug-iphonesimulator/LocalImageIQ.app
      - name: Package simulator app (not an installable iPhone IPA)
        if: ${{ !inputs.build_device_ipa }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/LocalImageIQ.app \
            build/LocalImageIQ-Simulator.zip
      - name: Export native UI review screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/UIReview
          fi
      - name: Build native arm64 device app without Apple credentials
        if: inputs.build_device_ipa
        run: |
          xcodebuild build -project LocalImageIQ.xcodeproj -target LocalImageIQ \
            -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/build/DeviceProducts" OBJROOT="$PWD/build/DeviceIntermediates" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            ENABLE_DEBUG_DYLIB=NO
          node scripts/package_device.mjs build/DeviceProducts/Release-iphoneos/LocalImageIQ.app build/device
      # Only generated test evidence and public model/place reports are collected.
      # App packages remain separate, and failed runs never publish an installable package.
      - name: Bundle release evidence
        if: always()
        run: |
          mkdir -p build/release-evidence
          if [ -d build/UIReview ]; then
            ditto -c -k --keepParent --norsrc build/UIReview build/release-evidence/UIReview.zip
          fi
          if [ -d build/TestResults.xcresult ]; then
            ditto -c -k --keepParent --norsrc build/TestResults.xcresult build/release-evidence/TestResults.xcresult.zip
          fi
          for report in Resources/Models/parity-report.json Resources/Models/provenance.json Resources/Places/places-manifest.json; do
            if [ -f "$report" ]; then cp "$report" build/release-evidence/; fi
          done
      - name: Upload verified assets to this public repository Release
        if: ${{ always() && inputs.publish_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_STATUS: ${{ job.status }}
          BUILD_DEVICE: ${{ inputs.build_device_ipa }}
          INCLUDE_MODELS: ${{ inputs.include_models }}
        run: |
          status=failure
          if [ "$UPSTREAM_STATUS" = "success" ]; then status=success; fi
          node scripts/publish_release.mjs --status "$status" --device "$BUILD_DEVICE" --models "$INCLUDE_MODELS"
      - name: Keep validation evidence without publishing an app
        if: ${{ always() && !inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: release-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release-evidence
            build/device/device-build.json
            build/device/SHA256SUMS.txt
            LocalImageIQ.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
      - name: Summarize validation boundary
        if: always()
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          echo '### Native iOS milestone' >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            echo 'Build/test assets are delivered through this public repository Release.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Engineering validation only: evidence is retained as an artifact, no app or Release is published.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'This run does not sign, upload to TestFlight, grant third-party licenses, or prove physical-iPhone performance.' >> "$GITHUB_STEP_SUMMARY"
          echo "Models requested: $IMAGEIQ_REQUIRE_MODELS. Model-free tests skip generated numerical parity; read xcresult for actual test outcomes." >> "$GITHUB_STEP_SUMMARY"
          echo 'All runs require the pinned CHN/FRA/DEU/NLD ADM1/ADM2 Places pack and bundled manifest. Check step outcomes; coverage is historical administrative boundaries, not global addresses or a phone-speed measurement.' >> "$GITHUB_STEP_SUMMARY"