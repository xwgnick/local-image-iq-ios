include:
  - project.models.yml

# Generate only after native tests pass; signing belongs to the application.
targets:
  LocalImageIQ:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.piankexun.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "48"
        DEVELOPMENT_TEAM: "$(IMAGEIQ_SIGNING_TEAM)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: "$(IMAGEIQ_SIGNING_PROFILE)"
