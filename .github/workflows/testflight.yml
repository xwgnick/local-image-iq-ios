name: TestFlight — signed FP16 1.0 build47

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piankexun-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.repository == 'xwgnick/local-image-iq-ios' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IMAGEIQ_REQUIRE_MODELS: '1'
      IMAGEIQ_TEST_ALL_COMPUTE_UNITS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Verify Apple credentials and application before expensive builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          node scripts/testflight.mjs --preflight
          node scripts/testflight.mjs --signing-check
      - name: Check reviewed source and release toolchain
        run: |
          node scripts/check_release.mjs --toolchain
          node scripts/check_project.mjs
          node scripts/check_release.mjs --source
          node --test scripts/test_testflight.mjs scripts/test_release.mjs
          python -m unittest discover -s scripts -p test_static.py
          plutil -lint App/Info.plist
          plutil -lint App/PrivacyInfo.xcprivacy
          swift test --package-path Packages/ImageIQCore
      - name: Prepare pinned offline resources and real models
        run: |
          python -m pip install shapely==2.1.2
          python scripts/build_places.py --download
          node scripts/check_places.mjs --pack-dir Resources/Places
          python -m venv .model-env
          .model-env/bin/python -m pip install -r scripts/requirements-coreml.txt
          .model-env/bin/python scripts/test_fp16_diagnostic.py
          .model-env/bin/python scripts/export_models.py --download --precision float16
          node scripts/check_project.mjs --models
      - name: Generate project and select simulator
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.models.yml
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available --json > "$RUNNER_TEMP/available-devices.json"
          node scripts/check_release.mjs --simulator "$RUNNER_TEMP/available-devices.json"
          xcodebuild -resolvePackageDependencies -project LocalImageIQ.xcodeproj -scheme LocalImageIQ \
            -clonedSourcePackagesDirPath build/SourcePackages
          node scripts/prepare_legal_notices.mjs build/SourcePackages/checkouts --check
      - name: Validate all native App and UI tests with real models
        run: |
          xcodebuild test -project LocalImageIQ.xcodeproj -scheme LocalImageIQ \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/TestResults.xcresult \
            -clonedSourcePackagesDirPath build/SourcePackages -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO IMAGEIQ_REQUIRE_MODELS=1 IMAGEIQ_TEST_ALL_COMPUTE_UNITS=1
      - name: Sign archive, verify export, upload once and confirm Apple processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: node scripts/testflight.mjs --upload
      - name: Remove any interrupted signing files
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/piankexun-signing/distribution.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/piankexun-signing/distribution.keychain-db"
          fi
          if [ -d "$RUNNER_TEMP/piankexun-signing" ]; then
            rm -r -- "$RUNNER_TEMP/piankexun-signing"
          fi
      - name: Retain safe delivery evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-delivery-${{ github.run_id }}
          path: build/testflight-delivery.json
          if-no-files-found: warn
      - name: Explain distribution boundary
        if: always()
        run: |
          echo '### Piankexun FP16 TestFlight 1.0 / 47' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bundle: app.piankexun.ios. No App Review submission, external beta review, tester invitation, pricing change or public release is performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only a VALID processing state in the delivery report confirms Apple processing. FP32 build46 remains the baseline; build47 is an FP16 experiment, not proven real-photo quality. A successful upload alone is not tester availability. Do not blindly rerun an attempted upload.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/testflight-delivery.json ]; then cat build/testflight-delivery.json >> "$GITHUB_STEP_SUMMARY"; fi
