name: LocalImageIQ
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ImageIQCore:
    path: Packages/ImageIQCore
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    # 1.3.4: c21fdcde390313a6d98d8e33a346f2c3486c3ab0 (root tools 5.9).
    # Minimum dependencies support Xcode 16.4; upstream transitive ranges are not locked here.
    exactVersion: "1.3.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LocalImageIQ:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Resources/Models
        excludes: [README.md, fixtures, licenses, provenance.json, parity-report.json, tokenizer-parity.json, image-preprocess-parity.json]
      # Generated before XcodeGen in every manual CI run, including model-free runs.
      # Explicit resource phase preserves both GeoJSON and its attribution/provenance manifest.
      - path: Resources/Places
        excludes: [README.md, Sources]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localimageiq
        INFOPLIST_FILE: App/Info.plist
        COREML_CODEGEN_LANGUAGE: None
    dependencies:
      - package: ImageIQCore
      - package: swift-transformers
        product: Tokenizers
      - sdk: libsqlite3.tbd
  LocalImageIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localimageiq.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalImageIQ.app/LocalImageIQ"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: LocalImageIQ
      - package: ImageIQCore
  LocalImageIQUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localimageiq.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LocalImageIQ
    dependencies:
      - target: LocalImageIQ
schemes:
  LocalImageIQ:
    build:
      targets:
        LocalImageIQ: all
        LocalImageIQTests: [test]
        LocalImageIQUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: LocalImageIQTests
          parallelizable: false
        - name: LocalImageIQUITests
          parallelizable: false
      environmentVariables:
        IMAGEIQ_REQUIRE_MODELS: "$(IMAGEIQ_REQUIRE_MODELS)"
        IMAGEIQ_TEST_ALL_COMPUTE_UNITS: "$(IMAGEIQ_TEST_ALL_COMPUTE_UNITS)"